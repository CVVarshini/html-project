<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmConnect - Success</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-dark: #3e8e41;
            --secondary: #f0f8f0;
            --text: #333;
            --light: #f9f9f9;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, var(--secondary), var(--light));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .success-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow);
            padding: 40px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-container h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .success-container p {
            margin-bottom: 20px;
        }
        .success-container a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .success-container a:hover {
            text-decoration: underline;
        }
        .success-icon {
            font-size: 50px;
            color: var(--primary);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h2>Registration Successful!</h2>
        <p>Thank you for signing up with FarmConnect.</p>
        <p><a href="/">Go to Home</a></p>
    </div>
</body>
</html>
